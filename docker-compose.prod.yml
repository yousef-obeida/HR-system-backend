# Production overlay — adds Caddy (automatic HTTPS via Let's Encrypt) in front
# of the stack and stops publishing the internal nginx port to the host.
#
# Activated on the VPS by setting in .env:
#     COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# so every `docker compose ...` command (including deploy.sh) loads both files.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # persisted certificates
      - caddy-config:/config
    depends_on:
      - nginx
    networks:
      - hr-net

  # Caddy reaches nginx over the internal network on port 80, so we no longer
  # publish nginx directly to the host.
  nginx:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
