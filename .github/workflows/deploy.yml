name: Deploy to VPS

# Auto-deploys on every push to main. Can also be triggered manually from the
# Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; cancel an in-progress one if a newer push lands.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy (build on VPS)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Fail the job (and surface logs) if any command in the script fails.
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            echo "Deploying commit ${{ github.sha }} on $(hostname)"
            bash deploy.sh
