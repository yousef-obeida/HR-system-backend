; Production PHP settings for the HR System API

memory_limit = 512M
max_execution_time = 120

; CV uploads (PDF) — allow reasonably large files.
upload_max_filesize = 25M
post_max_size = 30M

; Keep errors out of HTTP responses; rely on Laravel's logs instead.
display_errors = Off
display_startup_errors = Off
log_errors = On

expose_php = Off
date.timezone = UTC

; Realpath cache speeds up file resolution under load.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
